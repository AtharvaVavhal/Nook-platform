name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Scope guard self-tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest scripts/test_phase_scope.py scripts/test_db_guard.py
      - name: Verify phase scope
        run: npm run verify:scope
      - name: Backend TypeScript
        run: npm run typecheck --workspace @nook/api
      - name: Backend ESLint
        run: npx --no-install eslint apps/api
      - name: Backend Prettier
        run: npx --no-install prettier --check apps/api '!apps/api/src/generated/**'
      - name: Backend database-free unit tests
        run: node scripts/ci/run-unit.js
      - name: Frontend TypeScript
        run: npm run typecheck --workspace @nook/web
      - name: Frontend ESLint
        run: npx --no-install eslint apps/web
      - name: Frontend Prettier
        run: npx --no-install prettier --check apps/web
      - name: Frontend unit tests
        run: npm run test --workspace @nook/web
      - name: Static CI contract
        run: node scripts/ci/check.js
      - name: Offline G6A migration-path tests
        run: node --import tsx --test scripts/ci/g6a-migration.test.js
      - name: Offline G6B deployment and ledger tests
        run: node --import tsx --test scripts/ci/g6b-migration.test.js scripts/ci/migration-ledger.test.js scripts/ci/g6b-preflight.test.js
      - name: CI script lint and formatting
        run: |
          npx --no-install eslint scripts/ci
          npx --no-install prettier --check .github/workflows/ci.yml .github/workflows/g6a.yml scripts/ci
      - name: Build
        run: npm run build
      - name: Prisma schema validation (no database configuration)
        run: npx --no-install prisma validate --config scripts/ci/prisma.config.ts
      - name: Baseline secret scan
        run: npm run verify:secrets
      - name: Dependency audit
        run: npm audit --audit-level=high

  full-integration:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          # Masked, job-scoped read-only token; bootstrap only, never a test credential.
          POSTGRES_PASSWORD: ${{ github.token }}
        ports:
          - '127.0.0.1:5545:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify migration contents
        run: npm run verify:migration
      - name: Provision and test full profile
        env:
          CI_BOOTSTRAP_PASSWORD: ${{ github.token }}
        run: node --import tsx scripts/ci/integration.js full

  pilot-rehearsals:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Migration failure and forward-repair rehearsal (disposable PostgreSQL in Docker)
        env:
          NOOK_ALLOW_DISPOSABLE_INTEGRATION_DB: '1'
          # The same digest-pinned PostgreSQL build as the full-integration service.
          NOOK_DISPOSABLE_PG_IMAGE: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
        run: node --import tsx scripts/qa/pilot-phase1-disposable.mjs migration-recovery
